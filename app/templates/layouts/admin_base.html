<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="d-flex">

    <!-- Sidebar -->

    <div class="bg-dark text-white p-3 vh-100" style="width:260px;">

        <h3 class="text-center mb-4">
            🏛️ CEMS
        </h3>

       <ul class="nav flex-column">

    <li class="nav-item mb-2">
        <a class="nav-link {% if request.endpoint=='main.admin_dashboard' %}active{% endif %}"
           href="{{ url_for('main.admin_dashboard') }}">
            📊 Dashboard
        </a>
    </li>

    <li class="nav-item mb-2">
        <a class="nav-link {% if request.endpoint in ['main.manage_users','main.edit_user'] %}active{% endif %}"
           href="{{ url_for('main.manage_users') }}">
            👥 Users
        </a>
    </li>

    <li class="nav-item mb-2">
        <a class="nav-link {% if request.endpoint in ['main.faculties','main.create_faculty','main.edit_faculty'] %}active{% endif %}"
           href="{{ url_for('main.faculties') }}">
            🏫 Faculties
        </a>
    </li>

    <li class="nav-item mb-2">
        <a class="nav-link"
           href="#">
            🏢 Departments
        </a>
    </li>

    <li class="nav-item mb-2">
        <a class="nav-link"
           href="#">
            📑 Reports
        </a>
    </li>

    <li class="nav-item mb-2">
        <a class="nav-link"
           href="#">
            ⚙ Settings
        </a>
    </li>

</ul>
    </div>

  <!-- Main Content -->

<div class="flex-grow-1 p-4 bg-light">

    {% block content %}
    {% endblock %}

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

{% block scripts %}
{% endblock %}

</body>
</html>
